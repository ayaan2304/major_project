# Single source of truth for every experiment in this repository.
# Change values here; do not hard-code experiment knobs in scripts.

project:
  title: "Explanation-Preserving Imbalance-Aware Ensemble Learning for Mobile Money Fraud Detection"
  short_name: EP-IAIL
  seed: 42

paths:
  raw_csv: data/raw/PS_20174392719_1491204439457_log.csv
  processed_dir: data/processed
  results_dir: results

data:
  target: isFraud
  flagged_col: isFlaggedFraud
  time_col: step
  type_col: type
  orig_col: nameOrig
  dest_col: nameDest
  # Columns dropped in the original-style baseline (given; not re-derived).
  original_drop_cols: [step, type, nameOrig, nameDest]
  eps: 1.0e-6
  chunksize: 250000

split:
  original:
    test_size: 0.20
    stratified: true
  temporal:
    # Earliest -> train, middle -> validation, latest -> test (by `step`).
    train_frac: 0.70
    val_frac: 0.15
    test_frac: 0.15

compute:
  n_jobs: -1
  # Phase 0 always scans the FULL CSV.
  # Modeling approximation (documented, never silent): keep ALL fraud rows
  # after the split, then cap legitimate rows for CPU-bound estimators.
  # Set legit_cap to null to train on every legitimate row (very slow on CPU).
  keep_all_fraud: true
  legit_cap: 200000
  shap_background_n: 128
  shap_explain_n: 800
  shap_batch_size: 256
  stability_runs: 3
  bootstrap_ci_samples: 300
  temporal_windows: 4

models:
  logistic_regression:
    max_iter: 400
    class_weight: balanced
  decision_tree:
    max_depth: 12
    min_samples_leaf: 50
    class_weight: balanced
  random_forest:
    n_estimators: 120
    max_depth: 14
    min_samples_leaf: 20
    class_weight: balanced
    n_jobs: -1
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.08
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist
    n_jobs: -1
    eval_metric: logloss
  lightgbm:
    n_estimators: 250
    max_depth: -1
    num_leaves: 48
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    n_jobs: -1
  catboost:
    iterations: 200
    depth: 6
    learning_rate: 0.08
    verbose: false
    allow_writing_files: false
  mlp:
    hidden_layer_sizes: [64, 32]
    max_iter: 40
    early_stopping: true
    # MLP is the slowest CPU model; cap samples further (documented).
    max_samples: 80000

imbalance:
  random_oversample_strategy: 0.15
  smote:
    k_neighbors: 5
    sampling_strategy: 0.15
  borderline_smote:
    k_neighbors: 5
    kind: borderline-1
    sampling_strategy: 0.15

ep_iail:
  generator: borderline_smote   # smote | borderline_smote
  n_candidates: 12000
  k_neighbors: 5
  # Prototype strategies compared on a TRAIN-ONLY fraud holdout.
  prototype_candidates: [mean, median, trimmed_mean]
  trimmed_mean_proportiontocut: 0.10
  chosen_prototype: null        # filled at runtime after comparison
  # Similarity = w_cos * cosine + w_mag * magnitude_term (both in [0, 1]).
  cosine_weight: 0.70
  magnitude_weight: 0.30
  plausibility_metric: mahalanobis   # mahalanobis | euclidean
  # Percentiles chosen on train/val (never test). Grid is tiny on purpose.
  similarity_percentile_grid: [10, 20, 30]
  plausibility_percentile_grid: [70, 80, 90]
  default_similarity_percentile: 20
  default_plausibility_percentile: 80

cost:
  # Realistic mobile-money cost scenarios: missed fraud is more expensive.
  scenarios:
    conservative:
      C_FN: 10
      C_FP: 1
    balanced:
      C_FN: 25
      C_FP: 1
    aggressive:
      C_FN: 50
      C_FP: 1
  default_scenario: balanced
  threshold_grid_size: 99

evaluation:
  topk_fidelity: [1, 3, 5]
  local_case_counts:
    TP: 3
    TN: 3
    FP: 3
    FN: 3
    borderline: 3

logging:
  level: INFO
